<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Решатель Фано (Задание 4 ЕГЭ)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .node-circle { stroke-width: 2; }
        .node-known { fill: #ef4444; stroke: #b91c1c; } /* Красный */
        .node-found { fill: #22c55e; stroke: #15803d; } /* Зеленый */
        .node-intermediate { fill: #9ca3af; stroke: #4b5563; } /* Серый */
        .node-text { font-size: 14px; font-weight: bold; text-anchor: middle; dominant-baseline: central; fill: white; }
        .edge { stroke: #cbd5e1; stroke-width: 2; }
        .edge-label { font-size: 12px; font-weight: bold; fill: #475569; text-anchor: middle; background: white; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex justify-center text-slate-800">

    <div class="w-full max-w-5xl bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row">
        
        <!-- Левая панель: Настройки и ввод -->
        <div class="w-full md:w-1/3 bg-slate-50 p-6 border-r border-slate-200">
            <h1 class="text-2xl font-bold text-slate-900 mb-6">Условие Фано</h1>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">Известные коды</label>
                    <textarea id="known-codes" class="w-full border border-slate-300 rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" rows="3" placeholder="А-10, Б-110..."></textarea>
                    <p class="text-xs text-slate-500 mt-1">Формат: Буква-Код, через запятую или пробел.</p>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Весь алфавит</label>
                    <input type="text" id="alphabet" class="w-full border border-slate-300 rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="А, Б, В, Г, Д, Е, Ж, З">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Буква для поиска</label>
                    <input type="text" id="target-input" class="w-full border border-slate-300 rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ж">
                </div>

                <button onclick="solve()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded transition shadow">
                    Решить и построить
                </button>
            </div>
        </div>

        <!-- Правая панель: Результат и дерево -->
        <div class="w-full md:w-2/3 p-6 flex flex-col">
            <h2 class="text-lg font-bold mb-2">Результат</h2>
            <div id="result-text" class="text-base mb-4 p-4 bg-blue-50 text-blue-900 rounded border border-blue-100 min-h-[60px]">
                Введите данные и нажмите «Решить»...
            </div>
            
            <h2 class="text-lg font-bold mb-2">Дерево Фано</h2>
            <div class="flex-grow border border-slate-200 rounded bg-slate-50 relative overflow-hidden flex items-center justify-center min-h-[400px]">
                <svg id="tree-svg" width="100%" height="100%" viewBox="0 0 800 500" preserveAspectRatio="xMidYMin meet"></svg>
            </div>
        </div>
    </div>

    <script>
        function parseInput() {
            const knownRaw = document.getElementById('known-codes').value;
            const alphabetRaw = document.getElementById('alphabet').value;
            
            const known = {};
            const regex = /([А-Яа-яA-Za-z])\s*[-=:]\s*([01]+)/g;
            let match;
            while ((match = regex.exec(knownRaw)) !== null) {
                known[match[1].toUpperCase()] = match[2];
            }

            const alphabet = alphabetRaw.toUpperCase().replace(/[^А-ЯA-Z]/g, '').split('').filter((v, i, a) => a.indexOf(v) === i);
            
            return { known, alphabet };
        }

        function findShortestCode(knownCodes, totalAlphabetSize, targetLetter) {
            const existingValues = Object.values(knownCodes);
            const unassignedCount = totalAlphabetSize - existingValues.length - 1; // -1 for the target letter itself
            
            let queue = ["0", "1"];
            while(queue.length > 0) {
                let candidate = queue.shift();
                
                // Rule 1: Is candidate extending an existing leaf?
                let isExtension = existingValues.some(code => candidate.startsWith(code));
                if (isExtension) continue; // Dead end
                
                // Rule 2: Is candidate a prefix of existing codes (internal node)?
                let isPrefix = existingValues.some(code => code.startsWith(candidate));
                if (isPrefix) {
                    // Cannot place a letter here, but we can traverse deeper
                    queue.push(candidate + "0", candidate + "1");
                    continue;
                }
                
                // Rule 3: Free branch. Check if we have enough capacity for remaining letters.
                let capacityUsed = existingValues.reduce((sum, code) => sum + Math.pow(2, -code.length), 0);
                let candidateCapacity = Math.pow(2, -candidate.length);
                let remainingCapacity = 1 - capacityUsed - candidateCapacity;
                
                const EPSILON = 1e-10;
                
                if (unassignedCount === 0 && remainingCapacity > -EPSILON) {
                    return candidate;
                }
                if (unassignedCount > 0 && remainingCapacity > EPSILON) {
                    return candidate;
                }
                
                // If not enough capacity to place it here, branch deeper to create more leaves
                queue.push(candidate + "0", candidate + "1");
            }
            return null;
        }

        function solve() {
            try {
                const { known, alphabet } = parseInput();
                const targetLetter = document.getElementById('target-input').value.toUpperCase().trim()[0];
                const resultText = document.getElementById('result-text');

                if (!targetLetter) throw new Error("Введите целевую букву.");
                if (known[targetLetter]) {
                    resultText.innerHTML = `Буква <b>${targetLetter}</b> уже имеет код: <b>${known[targetLetter]}</b>`;
                    drawTree(known, targetLetter, known[targetLetter]);
                    return;
                }

                let bestCode = findShortestCode(known, alphabet.length, targetLetter);
                
                if (bestCode) {
                    resultText.innerHTML = `Кратчайший код для <b>${targetLetter}</b>: <span class="text-xl font-bold text-green-600">${bestCode}</span>`;
                    known[targetLetter] = bestCode;
                    drawTree(known, targetLetter, bestCode);
                } else {
                    resultText.innerHTML = `<span class="text-red-600">Невозможно подобрать код, соблюдая условие Фано для всего алфавита.</span>`;
                    drawTree(known, null, null);
                }

            } catch (e) {
                document.getElementById('result-text').innerHTML = `<span class="text-red-600 font-bold">Ошибка: ${e.message}</span>`;
            }
        }

        class TreeNode {
            constructor() {
                this.left = null;
                this.right = null;
                this.value = null;
                this.type = 'empty';
            }
        }

        function drawTree(knownCodes, targetLetter, targetCode) {
            const svg = document.getElementById('tree-svg');
            svg.innerHTML = ''; 
            
            // Build logical tree
            let root = new TreeNode();
            for (const [letter, code] of Object.entries(knownCodes)) {
                let current = root;
                for (let i = 0; i < code.length; i++) {
                    current.type = current.type === 'empty' ? 'intermediate' : current.type;
                    if (code[i] === '0') {
                        if (!current.left) current.left = new TreeNode();
                        current = current.left;
                    } else {
                        if (!current.right) current.right = new TreeNode();
                        current = current.right;
                    }
                }
                current.value = letter;
                current.type = (letter === targetLetter) ? 'found' : 'known';
            }

            const width = 800;
            const height = 500;
            const nodeRadius = 18;
            
            function getDepth(node) {
                if (!node) return 0;
                return 1 + Math.max(getDepth(node.left), getDepth(node.right));
            }
            const maxDepth = getDepth(root);
            const levelHeight = Math.min(80, height / (maxDepth || 1));

            let nodesToDraw = [];
            let linksToDraw = [];

            function calculatePositions(node, depth, leftBoundary, rightBoundary) {
                if (!node || node.type === 'empty') return null;

                const x = (leftBoundary + rightBoundary) / 2;
                const y = depth * levelHeight + 40; 

                const nodeData = { x, y, value: node.value, type: node.type };
                nodesToDraw.push(nodeData);

                if (node.left && node.left.type !== 'empty') {
                    const leftChild = calculatePositions(node.left, depth + 1, leftBoundary, x);
                    linksToDraw.push({ source: nodeData, target: leftChild, label: '0' });
                }
                if (node.right && node.right.type !== 'empty') {
                    const rightChild = calculatePositions(node.right, depth + 1, x, rightBoundary);
                    linksToDraw.push({ source: nodeData, target: rightChild, label: '1' });
                }

                return nodeData;
            }

            calculatePositions(root, 0, 0, width);

            // Draw edges
            linksToDraw.forEach(link => {
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', link.source.x);
                line.setAttribute('y1', link.source.y);
                line.setAttribute('x2', link.target.x);
                line.setAttribute('y2', link.target.y);
                line.setAttribute('class', 'edge');
                svg.appendChild(line);

                const textX = (link.source.x + link.target.x) / 2;
                const textY = (link.source.y + link.target.y) / 2 - 5;
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', textX);
                text.setAttribute('y', textY);
                text.setAttribute('class', 'edge-label');
                text.textContent = link.label;
                svg.appendChild(text);
            });

            // Draw nodes
            nodesToDraw.forEach(n => {
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', n.x);
                circle.setAttribute('cy', n.y);
                circle.setAttribute('r', nodeRadius);
                circle.setAttribute('class', `node-circle node-${n.type}`);
                svg.appendChild(circle);

                if (n.value) {
                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttribute('x', n.x);
                    text.setAttribute('y', n.y);
                    text.setAttribute('class', 'node-text');
                    text.textContent = n.value;
                    svg.appendChild(text);
                }
            });
        }

        window.onload = () => {
            document.getElementById('known-codes').value = "А-10, Б-110, В-010, Г-0110, Д-111, Е-0111";
            document.getElementById('alphabet').value = "А, Б, В, Г, Д, Е, Ж, З";
            document.getElementById('target-input').value = "Ж";
            solve();
        };
    </script>
</body>
</html>
