<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemical Equation Balancer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        .subscript {
            vertical-align: sub;
            font-size: 0.7em;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-300 flex flex-col font-sans">

    <header class="w-full max-w-4xl mx-auto p-6 flex justify-between items-center">
        <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-teal-500 dark:from-blue-400 dark:to-teal-300">ChemBalancer</h1>
        <button id="themeToggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors focus:outline-none">
            <svg id="moonIcon" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            <svg id="sunIcon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        </button>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center p-6 w-full max-w-4xl mx-auto">
        <div class="w-full bg-white dark:bg-gray-800 rounded-2xl shadow-xl overflow-hidden border border-gray-100 dark:border-gray-700 transition-colors duration-300">
            <div class="p-8">
                <h2 class="text-3xl font-bold mb-2">Balance Equations</h2>
                <p class="text-gray-500 dark:text-gray-400 mb-8">Enter an unbalanced chemical equation. Supports organics, inorganics, and parentheses.</p>
                
                <div class="space-y-4">
                    <div>
                        <label for="equationInput" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Equation (e.g., C2H5OH + O2 -> CO2 + H2O)</label>
                        <input type="text" id="equationInput" placeholder="H2 + O2 = H2O" 
                               class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all dark:text-white font-mono text-lg"
                               autocomplete="off" spellcheck="false">
                    </div>
                    
                    <button id="balanceBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
                        Balance
                    </button>
                </div>
            </div>

            <div id="resultContainer" class="bg-gray-50 dark:bg-gray-900/50 p-8 border-t border-gray-100 dark:border-gray-700 hidden transition-all duration-300">
                <h3 class="text-sm font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-3">Result</h3>
                <div id="resultOutput" class="text-2xl font-medium break-words py-4"></div>
                <div id="errorMessage" class="text-red-500 bg-red-100 dark:bg-red-900/30 dark:text-red-400 p-4 rounded-lg hidden"></div>
            </div>
        </div>
    </main>

    <script>
        // Theme toggling logic
        const html = document.documentElement;
        const themeToggle = document.getElementById('themeToggle');
        const sunIcon = document.getElementById('sunIcon');
        const moonIcon = document.getElementById('moonIcon');

        function updateTheme() {
            if (html.classList.contains('dark')) {
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
            } else {
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
            }
        }

        themeToggle.addEventListener('click', () => {
            html.classList.toggle('dark');
            updateTheme();
        });

        // Initialize theme icons
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            html.classList.add('dark');
        }
        updateTheme();

        // DOM Elements
        const inputEl = document.getElementById('equationInput');
        const btnEl = document.getElementById('balanceBtn');
        const resultContainer = document.getElementById('resultContainer');
        const resultOutput = document.getElementById('resultOutput');
        const errorMessage = document.getElementById('errorMessage');

        // Parses a single molecule formula into an element count map
        function parseMolecule(formula) {
            let stack = [{}];
            let i = 0;
            while (i < formula.length) {
                let char = formula[i];
                if (char === '(' || char === '[') {
                    stack.push({});
                    i++;
                } else if (char === ')' || char === ']') {
                    let top = stack.pop();
                    if (!top) throw new Error("Mismatched parentheses");
                    i++;
                    let mult = '';
                    while (i < formula.length && /[0-9]/.test(formula[i])) {
                        mult += formula[i];
                        i++;
                    }
                    mult = mult ? parseInt(mult, 10) : 1;
                    let current = stack[stack.length - 1];
                    for (let el in top) {
                        current[el] = (current[el] || 0) + top[el] * mult;
                    }
                } else if (/[A-Z]/.test(char)) {
                    let el = char;
                    i++;
                    while (i < formula.length && /[a-z]/.test(formula[i])) {
                        el += formula[i];
                        i++;
                    }
                    let count = '';
                    while (i < formula.length && /[0-9]/.test(formula[i])) {
                        count += formula[i];
                        i++;
                    }
                    count = count ? parseInt(count, 10) : 1;
                    let current = stack[stack.length - 1];
                    current[el] = (current[el] || 0) + count;
                } else {
                    i++; // skip spaces or invalid chars internally
                }
            }
            if (stack.length !== 1) throw new Error("Mismatched parentheses");
            return stack[0];
        }

        function balanceEquation(equationStr) {
            // Split into reactants and products
            const parts = equationStr.replace(/\s+/g, '').split(/=|->/);
            if (parts.length !== 2) throw new Error("Equation must have a left and right side separated by '=' or '->'");

            const reactantsStr = parts[0].split('+').filter(Boolean);
            const productsStr = parts[1].split('+').filter(Boolean);

            if (reactantsStr.length === 0 || productsStr.length === 0) throw new Error("Missing molecules on one side");

            const allMolecules = [...reactantsStr, ...productsStr];
            const numReactants = reactantsStr.length;
            const parsedMolecules = allMolecules.map(parseMolecule);

            // Find all unique elements
            const elementsSet = new Set();
            parsedMolecules.forEach(mol => {
                Object.keys(mol).forEach(el => elementsSet.add(el));
            });
            const elements = Array.from(elementsSet);

            // Verify both sides have the same elements
            let reactantElements = new Set(), productElements = new Set();
            parsedMolecules.forEach((mol, idx) => {
                Object.keys(mol).forEach(el => {
                    if (idx < numReactants) reactantElements.add(el);
                    else productElements.add(el);
                });
            });
            
            for (let el of elements) {
                if (!reactantElements.has(el) || !productElements.has(el)) {
                    throw new Error(`Element ${el} is not present on both sides.`);
                }
            }

            // Build Matrix (rows = elements, cols = molecules)
            // Products get negative coefficients to solve Ax = 0
            let matrix = elements.map(el => {
                return allMolecules.map((_, colIdx) => {
                    let count = parsedMolecules[colIdx][el] || 0;
                    return colIdx < numReactants ? count : -count;
                });
            });

            // Solve matrix for null space
            return solveMatrix(matrix, allMolecules, numReactants);
        }

        // Simplified Math for Fractions
        function gcd(a, b) {
            return b < 1e-5 ? a : gcd(b, a % b);
        }
        function lcm(a, b) {
            return (a * b) / gcd(a, b);
        }

        function solveMatrix(matrix, allMolecules, numReactants) {
            let numRows = matrix.length;
            let numCols = matrix[0].length;
            let lead = 0;

            // RREF
            for (let r = 0; r < numRows; r++) {
                if (numCols <= lead) break;
                let i = r;
                while (Math.abs(matrix[i][lead]) < 1e-8) {
                    i++;
                    if (numRows === i) {
                        i = r;
                        lead++;
                        if (numCols === lead) break;
                    }
                }
                if (numCols === lead) break;

                // Swap rows i and r
                let temp = matrix[i];
                matrix[i] = matrix[r];
                matrix[r] = temp;

                let val = matrix[r][lead];
                for (let j = 0; j < numCols; j++) matrix[r][j] /= val;

                for (let i = 0; i < numRows; i++) {
                    if (i === r) continue;
                    val = matrix[i][lead];
                    for (let j = 0; j < numCols; j++) {
                        matrix[i][j] -= val * matrix[r][j];
                    }
                }
                lead++;
            }

            // Extract solution (assuming 1 free variable, usually the last one)
            // For simple chemical equations, nullity is 1. 
            let solution = new Array(numCols).fill(0);
            solution[numCols - 1] = 1; // Set free variable
            
            for (let i = 0; i < numRows; i++) {
                let pivot = -1;
                for (let j = 0; j < numCols - 1; j++) {
                    if (Math.abs(matrix[i][j] - 1) < 1e-8) { pivot = j; break; }
                }
                if (pivot !== -1) {
                    let sum = 0;
                    for (let j = pivot + 1; j < numCols; j++) {
                        sum += matrix[i][j] * solution[j];
                    }
                    solution[pivot] = -sum;
                }
            }

            // Convert to smallest integers
            let maxDenominator = 1;
            // Very naive decimal to fraction for coefficients (good enough for typical chemistry 1 to 20 range)
            const getDenom = (num) => {
                for (let d = 1; d <= 100; d++) {
                    if (Math.abs(Math.round(num * d) - num * d) < 1e-5) return d;
                }
                return 1; 
            };

            for (let i = 0; i < numCols; i++) {
                if (solution[i] < -1e-5) throw new Error("Negative coefficients found (reaction might be impossible or written backwards).");
                if (Math.abs(solution[i]) < 1e-5) throw new Error("Trivial solution found. Equation might be invalid.");
                maxDenominator = lcm(maxDenominator, getDenom(solution[i]));
            }

            let intSolution = solution.map(val => Math.round(val * maxDenominator));
            
            // Format output string
            return formatResult(intSolution, allMolecules, numReactants);
        }

        function formatResult(coeffs, molecules, numReactants) {
            const formatMolecule = (mol) => {
                return mol.replace(/\d+/g, match => `<span class="subscript">${match}</span>`);
            };

            let left = [], right = [];
            for (let i = 0; i < molecules.length; i++) {
                let c = coeffs[i] === 1 ? '' : `<span class="text-blue-600 dark:text-blue-400 font-bold">${coeffs[i]}</span>`;
                let m = formatMolecule(molecules[i]);
                let term = `${c}${m}`;
                
                if (i < numReactants) left.push(term);
                else right.push(term);
            }

            return `${left.join(' + ')} &rarr; ${right.join(' + ')}`;
        }

        btnEl.addEventListener('click', () => {
            const input = inputEl.value.trim();
            resultContainer.classList.remove('hidden');
            
            if (!input) {
                errorMessage.textContent = "Please enter an equation.";
                errorMessage.classList.remove('hidden');
                resultOutput.innerHTML = '';
                return;
            }

            try {
                const balancedHtml = balanceEquation(input);
                resultOutput.innerHTML = balancedHtml;
                errorMessage.classList.add('hidden');
            } catch (err) {
                errorMessage.textContent = err.message || "Could not balance equation. Please check your syntax.";
                errorMessage.classList.remove('hidden');
                resultOutput.innerHTML = '';
            }
        });

        // Enter key support
        inputEl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                btnEl.click();
            }
        });

    </script>
</body>
</html>
