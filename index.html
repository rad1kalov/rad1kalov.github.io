<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>bio</title>
<style>
  :root{
    --accent:#7c5cff; --accent2:#00e0ff;
    --text:#fff; --muted:rgba(255,255,255,.6);
    --card-bg:rgba(12,12,22,.5); --card-blur:18px;
    --radius:24px; --overlay:.6; --glow:22px;
    --font:'Inter',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:var(--font);color:var(--text);background:#05050c;
    overflow:hidden;min-height:100vh;position:relative;
    display:flex;align-items:center;justify-content:center;cursor:none;
  }
  body.native-cursor{cursor:auto}
  a,button,.tilt,.social,.play-btn{cursor:none}
  body.native-cursor a,body.native-cursor button{cursor:pointer}

  /* ---- layers ---- */
  #bg-video,#bg-image{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-4}
  #bg-image{background-size:cover;background-position:center;display:none}
  #particles{position:fixed;inset:0;z-index:-3;pointer-events:none}
  #bg-overlay{position:fixed;inset:0;z-index:-2;
    background:radial-gradient(circle at 25% 15%,rgba(124,92,255,.28),transparent 55%),
      radial-gradient(circle at 80% 85%,rgba(0,224,255,.2),transparent 55%),
      rgba(0,0,0,var(--overlay));}
  #viz{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.9}
  #fx{position:fixed;inset:0;z-index:40;pointer-events:none}

  /* ---- custom cursor ---- */
  .cur-dot,.cur-ring{position:fixed;top:0;left:0;z-index:9999;pointer-events:none;border-radius:50%;
    transform:translate(-50%,-50%);will-change:transform}
  .cur-dot{width:8px;height:8px;background:var(--accent2);box-shadow:0 0 10px var(--accent2)}
  .cur-ring{width:34px;height:34px;border:2px solid var(--accent);opacity:.7;
    transition:width .2s,height .2s,background .2s,border-color .2s}
  .cur-ring.hover{width:52px;height:52px;background:rgba(124,92,255,.18)}

  /* ---- enter gate ---- */
  #gate{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;
    align-items:center;justify-content:center;background:rgba(4,4,10,.9);
    backdrop-filter:blur(8px);transition:opacity .7s;cursor:none}
  #gate.hide{opacity:0;pointer-events:none}
  #gate h2{font-size:clamp(30px,7vw,64px);font-weight:900;letter-spacing:2px;
    background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent));
    background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 3s linear infinite,float 3s ease-in-out infinite}
  @keyframes shine{to{background-position:200% center}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  #gate p{margin-top:18px;color:var(--muted);letter-spacing:5px;text-transform:uppercase;font-size:12px;
    animation:blink 1.6s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}

  /* ---- card ---- */
  .tilt{perspective:1000px}
  .card{
    width:min(430px,92vw);position:relative;
    background:var(--card-bg);backdrop-filter:blur(var(--card-blur));-webkit-backdrop-filter:blur(var(--card-blur));
    border:1px solid rgba(255,255,255,.14);border-radius:var(--radius);
    padding:36px 32px 28px;text-align:center;
    box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 var(--glow) rgba(124,92,255,.25);
    transform-style:preserve-3d;transition:transform .1s;
    animation:rise .9s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1}}
  .card.neon::before{content:"";position:absolute;inset:-2px;border-radius:calc(var(--radius) + 2px);
    background:linear-gradient(120deg,var(--accent),var(--accent2),var(--accent),var(--accent2));
    background-size:300% 300%;z-index:-1;animation:border-flow 6s linear infinite;filter:blur(1px)}
  @keyframes border-flow{to{background-position:300% 0}}

  .layer{transform:translateZ(40px)}
  .avatar-wrap{position:relative;width:126px;height:126px;margin:0 auto 16px}
  .avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;
    border:3px solid transparent;
    background:linear-gradient(#0a0a14,#0a0a14) padding-box,linear-gradient(135deg,var(--accent),var(--accent2)) border-box;
    box-shadow:0 0 30px rgba(124,92,255,.4)}
  .avatar-ring{position:absolute;inset:-7px;border-radius:50%;border:2px dashed var(--accent);opacity:.5;
    animation:spin 8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .status-dot{position:absolute;right:9px;bottom:9px;width:22px;height:22px;border-radius:50%;
    background:#2ecc71;border:3px solid #0a0a14;box-shadow:0 0 14px #2ecc71;animation:pulseDot 2s infinite}
  @keyframes pulseDot{0%,100%{box-shadow:0 0 8px #2ecc71}50%{box-shadow:0 0 20px #2ecc71}}

  .name{font-size:30px;font-weight:900;letter-spacing:.5px;display:flex;gap:9px;justify-content:center;align-items:center}
  .name.rgb{background:linear-gradient(90deg,#ff4d4d,#f9cb28,#42e695,#00e0ff,#7c5cff,#ff4d4d);
    background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 4s linear infinite}
  .verified{width:22px;height:22px;color:var(--accent2);flex-shrink:0}
  .typed{margin-top:10px;color:var(--muted);font-size:15px;line-height:1.5;min-height:23px}
  .caret{display:inline-block;width:2px;height:16px;background:var(--accent2);margin-left:2px;
    vertical-align:middle;animation:blink 1s step-end infinite}

  .badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
  .badge{font-size:11px;padding:5px 13px;border-radius:999px;color:var(--muted);letter-spacing:.5px;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);
    transition:transform .2s,box-shadow .2s}
  .badge:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(124,92,255,.35);color:#fff}

  .stats{display:flex;gap:18px;justify-content:center;margin-top:18px;color:var(--muted);font-size:12px}
  .stats b{display:block;font-size:17px;color:#fff;font-weight:800}

  .socials{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
  .social{width:50px;height:50px;border-radius:15px;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;text-decoration:none;
    transition:transform .3s cubic-bezier(.2,1.4,.4,1),background .3s,box-shadow .3s;position:relative}
  .social svg{width:23px;height:23px;transition:transform .3s}
  .social:hover{transform:translateY(-6px) scale(1.1);
    background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 12px 26px rgba(124,92,255,.5)}
  .social:hover svg{transform:scale(1.15)}

  .player{margin-top:24px;padding:14px;border-radius:18px;text-align:left;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:13px}
  .cover{width:48px;height:48px;border-radius:11px;object-fit:cover;flex-shrink:0;box-shadow:0 4px 14px rgba(0,0,0,.5)}
  .cover.playing{animation:spin 8s linear infinite;border-radius:50%}
  .track-info{flex:1;min-width:0}
  .track-title{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .track-artist{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .progress{height:5px;border-radius:3px;background:rgba(255,255,255,.15);margin-top:9px;cursor:none;position:relative}
  .progress-fill{height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .play-btn{width:42px;height:42px;border-radius:50%;flex-shrink:0;border:none;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
    display:flex;align-items:center;justify-content:center;transition:transform .2s}
  .play-btn:hover{transform:scale(1.1)}
  .play-btn svg{width:18px;height:18px}

  .foot{margin-top:20px;font-size:11px;color:rgba(255,255,255,.35);letter-spacing:1px}

  /* ---- FAB ---- */
  .fab{position:fixed;bottom:20px;z-index:60;width:46px;height:46px;border-radius:50%;
    border:1px solid rgba(255,255,255,.15);background:rgba(15,15,25,.6);backdrop-filter:blur(10px);
    color:#fff;display:flex;align-items:center;justify-content:center;transition:transform .2s,background .2s}
  .fab:hover{transform:scale(1.12);background:rgba(124,92,255,.45)}
  .fab svg{width:20px;height:20px}
  #fs{right:20px}#mute{right:76px}#share{right:132px}

  audio{display:none}

  /* blog button */
  .blog-btn{display:inline-flex;align-items:center;gap:9px;margin-top:20px;padding:12px 22px;border-radius:14px;
    text-decoration:none;font-size:14px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 8px 22px rgba(124,92,255,.35);transition:transform .25s,box-shadow .25s}
  .blog-btn:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(124,92,255,.5)}
  .blog-btn svg{width:18px;height:18px}

  /* glitch name */
  .name.glitch #name{position:relative;animation:glitchTxt 2.6s infinite}
  @keyframes glitchTxt{0%,92%,100%{text-shadow:none;transform:none}
    93%{text-shadow:2px 0 var(--accent2),-2px 0 var(--accent);transform:translateX(1px)}
    95%{text-shadow:-2px 0 var(--accent2),2px 0 var(--accent);transform:translateX(-1px)}
    97%{text-shadow:2px 0 #ff4d6d,-2px 0 #00e0ff;transform:translateX(1px)}}

  /* tilt glare */
  .glare{position:absolute;inset:0;border-radius:var(--radius);pointer-events:none;opacity:0;
    background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.28),transparent 45%);
    transition:opacity .2s;mix-blend-mode:overlay}
  .card:hover .glare{opacity:1}

  /* widgets */
  .widgets{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
  .widget{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:12px;font-size:12px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:var(--muted)}
  .widget b{color:#fff;font-weight:700}
  .dc-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .dc-online{background:#3ba55d;box-shadow:0 0 8px #3ba55d}.dc-idle{background:#faa61a}
  .dc-dnd{background:#ed4245}.dc-offline{background:#747f8d}

  /* toast */
  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);z-index:120;
    background:rgba(20,20,32,.95);border:1px solid rgba(255,255,255,.15);padding:12px 20px;border-radius:12px;
    font-size:13px;opacity:0;transition:.3s;pointer-events:none;max-width:80vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<video id="bg-video" autoplay muted loop playsinline></video>
<div id="bg-image"></div>
<canvas id="particles"></canvas>
<div id="bg-overlay"></div>
<canvas id="viz"></canvas>
<canvas id="fx"></canvas>

<!-- cursor -->
<div class="cur-ring" id="cur-ring"></div>
<div class="cur-dot" id="cur-dot"></div>

<!-- gate -->
<div id="gate"><div><h2 id="gate-text">войти</h2><p>click anywhere</p></div></div>

<!-- card -->
<div class="tilt"><main class="card neon" id="card">
  <div class="layer">
    <div class="avatar-wrap">
      <div class="avatar-ring"></div>
      <img class="avatar" id="avatar" src="" alt="">
      <span class="status-dot" id="status-dot"></span>
    </div>
    <div class="name" id="name-wrap">
      <span id="name">username</span>
      <svg class="verified" id="verified" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 1.8 3 .2.9 2.9 2.2 2-1 2.9 1 2.9-2.2 2-.9 2.9-3 .2L12 22l-2.4-1.8-3-.2-.9-2.9-2.2-2 1-2.9-1-2.9 2.2-2 .9-2.9 3-.2z"/><path d="M10.5 13.5l-2-2L7 13l3.5 3.5L17 10l-1.5-1.5z" fill="#0a0a14"/></svg>
    </div>
    <p class="typed"><span id="typed-text"></span><span class="caret" id="caret"></span></p>
    <div class="badges" id="badges"></div>
    <div class="widgets" id="widgets"></div>
    <div class="stats" id="stats"></div>
    <div class="socials" id="socials"></div>
    <a class="blog-btn" id="blog-btn" style="display:none" target="_self"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v14a2 2 0 01-2 2H6a2 2 0 01-2-2z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span id="blog-label">Блог</span></a>
    <div class="player" id="player">
      <img class="cover" id="cover" src="" alt="">
      <div class="track-info">
        <div class="track-title" id="track-title">—</div>
        <div class="track-artist" id="track-artist">—</div>
        <div class="progress" id="progress"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
      <button class="play-btn" id="play-btn"></button>
    </div>
    <div class="foot" id="foot">made with ♥</div>
  </div>
  <div class="glare" id="glare"></div>
</main></div>

<audio id="audio" loop></audio>
<div class="toast" id="toast"></div>

<button class="fab" id="share" title="Поделиться"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button>
<button class="fab" id="mute" title="Звук"><svg id="mute-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 010 7"/></svg></button>
<button class="fab" id="fs" title="Полный экран"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3M3 16v3a2 2 0 002 2h3m13-5v3a2 2 0 01-2 2h-3"/></svg></button>

let clockTimer,discordTimer;
function renderWidgets(){
 const w=$('widgets');let html='';
 if(S.clock)html+=`<div class="widget" id="w-clock">🕐 <b id="clock-time">--:--:--</b></div>`;
 if(S.discord)html+=`<div class="widget" id="w-discord"><span class="dc-dot dc-offline" id="dc-dot"></span><span id="dc-text">Discord…</span></div>`;
 w.innerHTML=html;w.style.display=html?'flex':'none';
 clearInterval(clockTimer);
 if(S.clock){const upd=()=>{const el=$('clock-time');if(el)el.textContent=new Date().toLocaleTimeString('ru')};upd();clockTimer=setInterval(upd,1000)}
 clearInterval(discordTimer);
 if(S.discord){fetchDiscord();discordTimer=setInterval(fetchDiscord,30000)}

function fetchDiscord(){
 fetch('https://api.lanyard.rest/v1/users/'+encodeURIComponent(S.discord))
  .then(r=>r.json()).then(d=>{
    if(!d.success)throw 0;const u=d.data,st=u.discord_status||'offline';
    const dot=$('dc-dot'),txt=$('dc-text');if(!dot)return;
    dot.className='dc-dot dc-'+st;
    const names={online:'В сети',idle:'Не активен',dnd:'Не беспокоить',offline:'Не в сети'};
    let label=names[st]||st;
    const act=(u.activities||[]).find(a=>a.type===0);
    if(u.listening_to_spotify&&u.spotify)label='🎧 '+u.spotify.song+' — '+u.spotify.artist;
    else if(act)label='🎮 '+act.name;
    txt.innerHTML=`<b>${esc(u.discord_user?.username||'Discord')}</b> · ${esc(label)}`;
  }).catch(()=>{const txt=$('dc-text');if(txt)txt.textContent='Discord: не найден'});
}

/* ================= TYPING ================= */
let typeTimer,typedIdx=0,charIdx=0,deleting=false;
function startTyping(){
 clearTimeout(typeTimer);
 const lines=String(S.typed||'').split('|').map(s=>s.trim()).filter(Boolean);
 if(!lines.length){$('typed-text').textContent='';return}
 typedIdx%=lines.length;
 (function tick(){
   const full=lines[typedIdx];
   if(!deleting){charIdx++;if(charIdx>full.length){deleting=true;typeTimer=setTimeout(tick,1400);return}}
   else{charIdx--;if(charIdx<0){deleting=false;typedIdx=(typedIdx+1)%lines.length;charIdx=0}}
   $('typed-text').textContent=full.slice(0,Math.max(0,charIdx));
   typeTimer=setTimeout(tick,deleting?45:85);
 })();
}

/* ================= PARTICLES ================= */
const pcanvas=$('particles'),pctx=pcanvas.getContext('2d');let parts=[],praf,mcols=[];
function resizeP(){pcanvas.width=innerWidth;pcanvas.height=innerHeight}
addEventListener('resize',resizeP);resizeP();
function initParticles(){
 cancelAnimationFrame(praf);parts=[];let n=S.pcount;if(LOWPERF)n=Math.min(n,30);const t=S.particles,sp=S.pspeed/6;
 if(t==='none'){pctx.clearRect(0,0,pcanvas.width,pcanvas.height);return}
 if(t==='matrix'){mcols=[];const cols=Math.floor(pcanvas.width/14);for(let i=0;i<cols;i++)mcols[i]=Math.random()*pcanvas.height;loopMatrix();return}
 if(t==='aurora'){auroraT=0;loopAurora();return}
 for(let i=0;i<n;i++)parts.push(newPart(t,sp));
 loopParticles(t,sp);
}
let auroraT=0;
function loopAurora(){
 const w=pcanvas.width,h=pcanvas.height;pctx.clearRect(0,0,w,h);auroraT+=.005*(S.pspeed/6);
 for(let b=0;b<3;b++){
   const col=b%2?S.accent2:S.accent,yBase=h*.25+b*h*.13;
   pctx.beginPath();pctx.moveTo(0,h);
   for(let x=0;x<=w;x+=20){const y=yBase+Math.sin(x*.004+auroraT*3+b)*40+Math.sin(x*.011+auroraT*2)*25;pctx.lineTo(x,y)}
   pctx.lineTo(w,h);pctx.closePath();
   const g=pctx.createLinearGradient(0,yBase-60,0,h);
   g.addColorStop(0,hexRgba(col,.28));g.addColorStop(.5,hexRgba(col,.08));g.addColorStop(1,'rgba(0,0,0,0)');
   pctx.fillStyle=g;pctx.fill();
 }
 praf=requestAnimationFrame(loopAurora);
}
function newPart(t,sp){
 const w=pcanvas.width,h=pcanvas.height;
 return{x:Math.random()*w,y:Math.random()*h,
   vx:t==='rain'?sp*.6:(Math.random()-.5)*sp,
   vy:t==='snow'||t==='bubbles'?Math.random()*sp+.3:t==='rain'?Math.random()*8+9:(Math.random()-.5)*sp,
   r:t==='bubbles'?Math.random()*8+3:t==='stars'?Math.random()*1.6+.4:Math.random()*2.5+.8,
   len:Math.random()*14+8,a:Math.random()*.6+.3,tw:Math.random()*Math.PI*2}
}
function loopParticles(t,sp){
 const w=pcanvas.width,h=pcanvas.height;pctx.clearRect(0,0,w,h);
 const c1=S.accent,c2=S.accent2;
 for(const p of parts){
   p.x+=p.vx;p.y+=(t==='bubbles')?-Math.abs(p.vy):p.vy;p.tw+=.05;
   if(p.x<0)p.x=w;if(p.x>w)p.x=0;
   if(t==='bubbles'){if(p.y<-10){p.y=h+10;p.x=Math.random()*w}}
   else if(t==='snow'){if(p.y>h){p.y=-5;p.x=Math.random()*w}}
   else{if(p.y<0)p.y=h;if(p.y>h)p.y=0}
   if(t==='rain'){
     pctx.strokeStyle=hexRgba(c2,p.a*.6);pctx.lineWidth=1.4;pctx.lineCap='round';
     pctx.beginPath();pctx.moveTo(p.x,p.y);pctx.lineTo(p.x-p.vx*1.5,p.y-p.len);pctx.stroke();
     continue;
   }
   let alpha=p.a;if(t==='stars'||t==='fireflies')alpha=p.a*(0.5+0.5*Math.sin(p.tw));
   pctx.beginPath();pctx.arc(p.x,p.y,p.r,0,7);
   pctx.fillStyle=t==='fireflies'?hexRgba(c2,alpha):hexRgba('#ffffff',t==='snow'?alpha:alpha*.9);
   if(t==='fireflies'){pctx.shadowBlur=12;pctx.shadowColor=c2}else pctx.shadowBlur=0;
   pctx.fill();
 }
 pctx.shadowBlur=0;
 if(t==='network'){
   for(let i=0;i<parts.length;i++)for(let j=i+1;j<parts.length;j++){
     const a=parts[i],b=parts[j],d=Math.hypot(a.x-b.x,a.y-b.y);
     if(d<120){pctx.strokeStyle=hexRgba(c1,(1-d/120)*.4);pctx.lineWidth=1;
       pctx.beginPath();pctx.moveTo(a.x,a.y);pctx.lineTo(b.x,b.y);pctx.stroke()}
   }
   for(const a of parts){const d=Math.hypot(a.x-mouse.x,a.y-mouse.y);
     if(d<160){pctx.strokeStyle=hexRgba(c2,(1-d/160)*.5);pctx.beginPath();pctx.moveTo(a.x,a.y);pctx.lineTo(mouse.x,mouse.y);pctx.stroke()}}
 }
 praf=requestAnimationFrame(()=>loopParticles(t,sp));
}
function loopMatrix(){
 const w=pcanvas.width,h=pcanvas.height;
 pctx.fillStyle='rgba(5,5,12,.08)';pctx.fillRect(0,0,w,h);
 pctx.fillStyle=S.accent2;pctx.font='14px monospace';
 const chars='ｱｲｳ01アカサ<>*+=$#';
 for(let i=0;i<mcols.length;i++){
   const ch=chars[Math.floor(Math.random()*chars.length)];
   pctx.fillText(ch,i*14,mcols[i]);
   if(mcols[i]>h&&Math.random()>.975)mcols[i]=0;mcols[i]+=14*(S.pspeed/6);
 }
 praf=requestAnimationFrame(loopMatrix);
}

/* ================= AUDIO VISUALIZER ================= */
const vcanvas=$('viz'),vctx=vcanvas.getContext('2d');let analyser,vdata,vsrc,vraf,actx;
function resizeV(){vcanvas.width=innerWidth;vcanvas.height=innerHeight}addEventListener('resize',resizeV);resizeV();
function setupViz(){
 if(analyser)return;
 try{actx=new(window.AudioContext||window.webkitAudioContext)();
   vsrc=actx.createMediaElementSource(audio);analyser=actx.createAnalyser();
   analyser.fftSize=128;vsrc.connect(analyser);analyser.connect(actx.destination);
   vdata=new Uint8Array(analyser.frequencyBinCount);drawViz();
 }catch(e){console.warn('viz off',e)}
}
function drawViz(){
 vraf=requestAnimationFrame(drawViz);
 if(!analyser)return;
 vctx.clearRect(0,0,vcanvas.width,vcanvas.height);
 if(!S.viz)return;
 analyser.getByteFrequencyData(vdata);
 const W=vcanvas.width,H=vcanvas.height,n=vdata.length;vctx.lineCap='round';
 if(S.vizstyle==='bars'){
   const bw=W/n;
   for(let i=0;i<n;i++){const v=vdata[i]/255,h=v*H*.35;
     const g=vctx.createLinearGradient(0,H,0,H-h);g.addColorStop(0,hexRgba(S.accent,.7));g.addColorStop(1,hexRgba(S.accent2,.9));
     vctx.fillStyle=g;vctx.fillRect(i*bw+1,H-h,bw-2,h)}
 }else if(S.vizstyle==='wave'){
   vctx.beginPath();vctx.moveTo(0,H/2);
   for(let i=0;i<n;i++){const v=vdata[i]/255,x=i/n*W,y=H/2-(v-.2)*H*.4;vctx.lineTo(x,y)}
   vctx.strokeStyle=hexRgba(S.accent2,.7);vctx.lineWidth=3;vctx.stroke();
   vctx.beginPath();vctx.moveTo(0,H/2);
   for(let i=0;i<n;i++){const v=vdata[i]/255,x=i/n*W,y=H/2+(v-.2)*H*.4;vctx.lineTo(x,y)}
   vctx.strokeStyle=hexRgba(S.accent,.5);vctx.stroke();
 }else{
   const cx=W/2,cy=H/2,base=Math.min(W,H)*.28;
   for(let i=0;i<n;i++){const v=vdata[i]/255,ang=(i/n)*Math.PI*2-Math.PI/2,len=v*120;
     const x1=cx+Math.cos(ang)*base,y1=cy+Math.sin(ang)*base;
     const x2=cx+Math.cos(ang)*(base+len),y2=cy+Math.sin(ang)*(base+len);
     vctx.strokeStyle=hexRgba(i%2?S.accent2:S.accent,.5+v*.5);vctx.lineWidth=3;
     vctx.beginPath();vctx.moveTo(x1,y1);vctx.lineTo(x2,y2);vctx.stroke()}
 }
}

/* ================= POINTER (cursor, trail, tilt, glare, parallax — единый rAF) =================
   Раньше на каждое движение мыши срабатывали 4 отдельных слушателя, каждый писал в DOM
   без троттлинга (перерисовка backdrop-filter карточки + масштабирование фонового видео).
   Теперь mousemove только запоминает позицию, а вся тяжёлая работа идёт максимум раз в кадр. */
const mouse={x:innerWidth/2,y:innerHeight/2};let rx=mouse.x,ry=mouse.y,pointerDirty=true;
const dot=$('cur-dot'),ring=$('cur-ring'),card=$('card');
const bgVideoEl=$('bg-video'),bgImageEl=$('bg-image');
addEventListener('mousemove',e=>{
 mouse.x=e.clientX;mouse.y=e.clientY;pointerDirty=true;
 if(S.cursor)dot.style.transform=`translate(${e.clientX}px,${e.clientY}px) translate(-50%,-50%)`;
 if(S.trail&&Math.random()>.6)spawnTrail(e.clientX,e.clientY);
},{passive:true});
document.addEventListener('mouseover',e=>{if(e.target.closest('a,button,.social'))ring.classList.add('hover');else ring.classList.remove('hover')},{passive:true});
function pointerLoop(){
 requestAnimationFrame(pointerLoop);
 rx+=(mouse.x-rx)*.18;ry+=(mouse.y-ry)*.18;
 ring.style.transform=`translate(${rx}px,${ry}px) translate(-50%,-50%)`;
 if(!pointerDirty)return;pointerDirty=false;               // тяжёлые записи — только если мышь двигалась
 const mx=mouse.x,my=mouse.y;
 card.style.transform=S.tilt?`rotateX(${(my/innerHeight-.5)*-12}deg) rotateY(${(mx/innerWidth-.5)*12}deg)`:'';
 const r=card.getBoundingClientRect();
 card.style.setProperty('--gx',((mx-r.left)/r.width*100)+'%');
 card.style.setProperty('--gy',((my-r.top)/r.height*100)+'%');
 if(S.parallax){const tf=`scale(1.08) translate(${-(mx/innerWidth-.5)*22}px,${-(my/innerHeight-.5)*22}px)`;
   bgVideoEl.style.transform=tf;bgImageEl.style.transform=tf}
}
pointerLoop();

/* ================= FX CANVAS (trail + confetti) ================= */
const fx=$('fx'),fctx=fx.getContext('2d');let fxp=[],fxNeedsClear=false;
function resizeF(){fx.width=innerWidth;fx.height=innerHeight}addEventListener('resize',resizeF);resizeF();
function spawnTrail(x,y){fxp.push({x,y,vx:(Math.random()-.5)*1.5,vy:(Math.random()-.5)*1.5,life:1,r:Math.random()*3+1,type:'t'})}
function burst(x,y,emojis){
 const cols=[S.accent,S.accent2,'#ffd60a','#ff4d6d','#42e695','#00e0ff'];
 for(let i=0;i<60;i++){const a=Math.random()*Math.PI*2,s=Math.random()*7+2;
   fxp.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,life:1,r:Math.random()*5+2,
     color:cols[Math.floor(Math.random()*cols.length)],
     emoji:emojis?emojis[0]:null,type:'c',rot:Math.random()*6,vr:(Math.random()-.5)*.4})}
}
function fxLoop(){
 requestAnimationFrame(fxLoop);
 if(!fxp.length){                          // нет частиц — не трогаем canvas каждый кадр
   if(fxNeedsClear){fctx.clearRect(0,0,fx.width,fx.height);fxNeedsClear=false}
   return;
 }
 fxNeedsClear=true;
 fctx.clearRect(0,0,fx.width,fx.height);
 for(let i=fxp.length-1;i>=0;i--){const p=fxp[i];
   p.x+=p.vx;p.y+=p.vy;if(p.type==='c')p.vy+=.15;p.vx*=.99;p.life-=p.type==='t'?.06:.012;
   if(p.rot!=null)p.rot+=p.vr;
   if(p.life<=0){fxp.splice(i,1);continue}
   if(p.emoji){fctx.globalAlpha=Math.max(0,p.life);fctx.font='20px sans-serif';fctx.fillText(p.emoji,p.x,p.y);fctx.globalAlpha=1;continue}
   fctx.globalAlpha=Math.max(0,p.life);
   fctx.fillStyle=p.color||S.accent2;
   if(p.type==='c'){fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.rot||0);fctx.fillRect(-p.r,-p.r,p.r*2,p.r*2.4);fctx.restore();}
   else{fctx.beginPath();fctx.arc(p.x,p.y,p.r*p.life,0,7);fctx.fill()}
   fctx.globalAlpha=1;
 }
}
fxLoop();

/* ================= INIT — данные из bio-settings.json ================= */
async function boot(){
 try{
   const res=await fetch('bio-settings.json',{cache:'no-store'});
   if(res.ok){const data=await res.json();S={...DEFAULTS,...data}}
   else console.warn('bio-settings.json: HTTP '+res.status);
 }catch(e){
   console.warn('Не удалось прочитать bio-settings.json:',e.message||e);
   if(location.protocol==='file:')
     toast('⚠ JSON не читается при открытии файла напрямую. Захостите сайт или запустите локальный сервер.');
 }
 render();
}
boot();
</script>
