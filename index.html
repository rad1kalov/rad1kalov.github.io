<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio</title>
    <style>
        :root {
            --theme-color: #00ffcc;
            --glow-strength: 20px;
            --card-bg: rgba(10, 10, 10, 0.6);
            --card-blur: 16px;
            --card-radius: 20px;
            --card-border: rgba(255, 255, 255, 0.15);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0; overflow: hidden;
            background-color: #050505; color: #fff;
            font-family: 'Consolas', 'Courier New', monospace;
            cursor: none; user-select: none;
        }

        #bg-canvas {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -2; pointer-events: none;
        }

        .cursor-dot, .cursor-trail {
            position: fixed; top: 0; left: 0;
            border-radius: 50%; pointer-events: none;
            will-change: transform;
            transform: translate3d(-50%, -50%, 0);
        }
        .cursor-dot { width: 6px; height: 6px; background: #fff; z-index: 99999; }
        .cursor-trail {
            width: 26px; height: 26px;
            border: 1.5px solid var(--theme-color);
            box-shadow: 0 0 var(--glow-strength) var(--theme-color);
            z-index: 99998;
        }

        #enter-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #050505; z-index: 99990;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: opacity 0.4s ease;
        }
        #enter-screen span {
            font-size: 18px; font-weight: bold; letter-spacing: 2px;
            color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.4);
            animation: pulse 1.6s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1); text-shadow: 0 0 var(--glow-strength) var(--theme-color); }
        }

        .crt-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.04));
            background-size: 100% 3px, 3px 100%; z-index: -1; pointer-events: none;
            display: none;
        }

        .vignette {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            box-shadow: inset 0 0 200px rgba(0,0,0,0.95);
            z-index: -1; pointer-events: none; display: none;
        }

        .container {
            display: flex; justify-content: center; align-items: center;
            height: 100vh; perspective: 1000px;
        }
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(var(--card-blur)); -webkit-backdrop-filter: blur(var(--card-blur));
            padding: 35px 40px; border-radius: var(--card-radius);
            border: 1px solid var(--card-border); text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
            transform-style: preserve-3d; width: 320px; will-change: transform;
        }

        .avatar-box {
            position: relative; width: 110px; height: 110px;
            margin: 0 auto 15px auto; transform: translateZ(50px);
        }
        .avatar {
            width: 100%; height: 100%; border-radius: 50%;
            border: 2px solid var(--card-border); object-fit: cover;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }
        .status-dot {
            width: 20px; height: 20px; border-radius: 50%;
            position: absolute; bottom: 2px; right: 2px;
            border: 3px solid #0a0a0a; background-color: #747f8d;
            transition: background-color 0.3s;
        }

        h1 {
            font-size: 22px; margin: 5px 0 3px 0; transform: translateZ(35px);
            letter-spacing: 0.5px; position: relative; display: inline-block;
        }
        h1.glitch:hover { animation: glitch-skew 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite; }
        @keyframes glitch-skew {
            0% { transform: translateZ(35px) translate(0); text-shadow: 2px 0 var(--theme-color), -2px 0 #ff003c; }
            20% { transform: translateZ(35px) translate(-2px, 2px); text-shadow: -2px 0 var(--theme-color), 2px 0 #ff003c; }
            40% { transform: translateZ(35px) translate(-2px, -2px); text-shadow: 2px 0 var(--theme-color), -2px 0 #ff003c; }
            60% { transform: translateZ(35px) translate(2px, 2px); text-shadow: -2px 0 var(--theme-color), 2px 0 #ff003c; }
            80% { transform: translateZ(35px) translate(2px, -2px); text-shadow: 2px 0 var(--theme-color), -2px 0 #ff003c; }
            100% { transform: translateZ(35px) translate(0); text-shadow: 2px 0 var(--theme-color), -2px 0 #ff003c; }
        }

        .bio {
            font-size: 13px; color: var(--theme-color); margin-bottom: 12px;
            transform: translateZ(30px); min-height: 16px;
            text-shadow: 0 0 8px var(--theme-color);
        }

        .discord-status-badge {
            transform: translateZ(30px); background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--card-border);
            padding: 7px 12px; border-radius: 8px; font-size: 11px;
            color: #ddd; margin-bottom: 15px; display: none;
            align-items: center; justify-content: center;
        }
        .discord-status-badge span {
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 230px;
        }

        .links { transform: translateZ(25px); }
        .links a {
            display: block; margin: 8px 0; padding: 10px;
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--card-border);
            text-decoration: none; color: #fff; border-radius: 8px;
            transition: background 0.2s, border-color 0.2s, box-shadow 0.2s, color 0.2s;
            font-weight: bold; letter-spacing: 1px; font-size: 13px; cursor: none;
        }
        .links a:hover {
            background: var(--theme-color); color: #000;
            box-shadow: 0 0 var(--glow-strength) var(--theme-color);
            border-color: var(--theme-color);
        }

        .player {
            margin-top: 15px; transform: translateZ(25px); display: flex;
            align-items: center; justify-content: center; gap: 12px;
            background: rgba(0, 0, 0, 0.4); padding: 8px 14px; border-radius: 10px;
            border: 1px solid var(--card-border);
        }
        .play-btn { background: none; border: none; color: white; font-size: 16px; cursor: none; transition: transform 0.1s;}
        .play-btn:active { transform: scale(0.9); }
        .song-title { font-size: 12px; opacity: 0.8; max-width: 190px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* --- Settings Dashboard --- */
        #settings-panel {
            position: fixed; top: 20px; left: 20px; bottom: 20px;
            background: rgba(8, 8, 8, 0.96); border: 1px solid #252525;
            padding: 16px; border-radius: 12px; width: 330px;
            display: none; flex-direction: column; z-index: 100000; cursor: default;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
        }
        #settings-scroll {
            overflow-y: auto; overflow-x: hidden; flex: 1; padding-right: 6px;
            display: flex; flex-direction: column; gap: 10px;
        }
        #settings-scroll::-webkit-scrollbar { width: 4px; }
        #settings-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        .set-group { border-bottom: 1px solid #1a1a1a; padding-bottom: 8px; display: flex; flex-direction: column; gap: 5px; }
        .set-group-title { font-size: 11px; text-transform: uppercase; color: var(--theme-color); font-weight: bold; letter-spacing: 1px; }
        
        .set-row { display: flex; justify-content: space-between; align-items: center; }
        .set-row label { font-size: 11px; color: #bbb; }
        .set-row input[type="text"], .set-row input[type="number"], .set-row select {
            background: #121212; border: 1px solid #2a2a2a; color: #fff;
            padding: 4px 6px; border-radius: 4px; font-family: inherit; font-size: 11px; width: 140px;
        }
        .set-row input[type="range"] { width: 110px; }
        .set-row input[type="color"] { background: none; border: none; width: 30px; height: 24px; cursor: pointer; }

        .btn-stack { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; }
        .btn-stack button { background: #fff; color: #000; border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 11px; }
        .btn-stack button:hover { background: #ddd; }
        .btn-stack button.secondary { background: #1c1c1c; color: #fff; border: 1px solid #333; }
        .btn-stack button.secondary:hover { background: #2a2a2a; }

        .hint { position: fixed; top: 10px; left: 10px; font-size: 11px; opacity: 0.35; z-index: 10; pointer-events: none; }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="cursor-dot" id="cursor-dot"></div>
    <div class="cursor-trail" id="cursor-trail"></div>

    <div id="enter-screen" onclick="enterSite()">
        <span id="enter-text">[ Click to enter ]</span>
    </div>

    <div class="hint">Двойной клик по пустому месту — настройки</div>
    <div class="crt-overlay" id="crt-overlay"></div>
    <div class="vignette" id="vignette"></div>
    <audio id="bg-audio" loop></audio>

    <div class="container" id="container">
        <div class="card" id="card">
            <div class="avatar-box">
                <img id="avatar" src="" alt="Avatar" class="avatar">
                <div class="status-dot" id="discord-status-dot"></div>
            </div>
            
            <h1 id="nickname">Loading...</h1>
            <div class="bio" id="bio-text"></div>
            
            <div class="discord-status-badge" id="discord-activity-badge">
                <span id="discord-activity-text"></span>
            </div>

            <div class="links">
                <a id="link-tg" href="#" target="_blank">Telegram</a>
                <a id="link-ds" href="#" target="_blank">Discord</a>
            </div>
            
            <div class="player">
                <button class="play-btn" id="play-pause">⏸</button>
                <div class="song-title" id="song-title">Loading...</div>
            </div>
        </div>
    </div>

    <div id="settings-panel">
        <div style="font-size: 13px; font-weight: bold; margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 4px;">Параметры Визитки</div>
        <div id="settings-scroll">
            <div class="set-group">
                <div class="set-group-title">Профиль</div>
                <div class="set-row"><label>Никнейм</label><input type="text" id="set-nickname"></div>
                <div class="set-row"><label>Glitch Ника при наведении</label><select id="set-glitch"><option value="true">Вкл</option><option value="false">Выкл</option></select></div>
                <div class="set-row"><label>Текст био</label><input type="text" id="set-bio"></div>
                <div class="set-row"><label>Скорость печати (мс)</label><input type="number" id="set-typespeed" min="10" max="300"></div>
                <div class="set-row"><label>URL Аватарки</label><input type="text" id="set-avatar"></div>
                <div class="set-row"><label>Бегущий заголовок (Вкладка)</label><select id="set-scrolltitle"><option value="true">Вкл</option><option value="false">Выкл</option></select></div>
            </div>
            <div class="set-group">
                <div class="set-group-title">Цвет и Эффекты (Chroma)</div>
                <div class="set-row"><label>Акцентный цвет</label><input type="color" id="set-color"></div>
                <div class="set-row"><label>RGB / Chroma Mode</label><select id="set-chroma"><option value="true">Вкл</option><option value="false">Выкл</option></select></div>
                <div class="set-row"><label>Сила свечения (px)</label><input type="range" id="set-glow" min="0" max="50"></div>
                <div class="set-row"><label>Виньетка (Затемнение краев)</label><select id="set-vignette"><option value="true">Вкл</option><option value="false">Выкл</option></select></div>
                <div class="set-row"><label>CRT Полосы</label><select id="set-crt"><option value="true">Вкл</option><option value="false">Выкл</option></select></div>
                <div class="set-row"><label>Искры при клике</label><select id="set-sparks"><option value="true">Вкл</option><option value="false">Выкл</option></select></div>
            </div>
            <div class="set-group">
                <div class="set-group-title">Discord & Lanyard</div>
                <div class="set-row"><label>Discord ID</label><input type="text" id="set-dsid"></div>
                <div class="set-row"><label>Точка статуса</label><select id="set-showstatus"><option value="true">Вкл</option><option value="false">Выкл</option></select></div>
                <div class="set-row"><label>Плашка активности</label><select id="set-showact"><option value="true">Вкл</option><option value="false">Выкл</option></select></div>
            </div>
            <div class="set-group">
                <div class="set-group-title">Ссылки и Аудио</div>
                <div class="set-row"><label>Telegram URL</label><input type="text" id="set-tg"></div>
                <div class="set-row"><label>Discord URL</label><input type="text" id="set-ds"></div>
                <div class="set-row"><label>Аудио URL</label><input type="text" id="set-audio"></div>
                <div class="set-row"><label>Название трека</label><input type="text" id="set-song"></div>
                <div class="set-row"><label>Громкость</label><input type="range" id="set-volume" min="0" max="1" step="0.05"></div>
            </div>
            <div class="set-group">
                <div class="set-group-title">Стекло Карточки</div>
                <div class="set-row"><label>Цвет карты</label><input type="color" id="set-cardbg"></div>
                <div class="set-row"><label>Прозрачность</label><input type="range" id="set-cardop" min="0.05" max="1" step="0.05"></div>
                <div class="set-row"><label>Размытие (blur)</label><input type="range" id="set-cardblur" min="0" max="40"></div>
            </div>
            <div class="set-group">
                <div class="set-group-title">Фон (Canvas)</div>
                <div class="set-row"><label>Тип фона</label><select id="set-bgtype"><option value="matrix">Матрица</option><option value="particles">Частицы</option><option value="gradient">Градиент</option><option value="void">Тьма</option></select></div>
                <div class="set-row"><label>Кол-во частиц (Для Particles)</label><input type="number" id="set-pcount" min="10" max="250"></div>
                <div class="set-row"><label>Шлейф курсора</label><select id="set-trail"><option value="true">Вкл</option><option value="false">Выкл</option></select></div>
            </div>
        </div>
        <div class="btn-stack">
            <button onclick="downloadJson()">СКАЧАТЬ CONFIG.JSON</button>
            <button class="secondary" onclick="applyPreview()">Применить предпросмотр</button>
        </div>
    </div>

    <script>
        let CFG = {};
        let lanyardWs = null;
        let typeWriterTimeout, titleInterval;
        let isPlaying = false;
        
        let sparks = []; // Искры при клике
        let chromaHue = 0; // Для RGB режима

        const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2, rawX: window.innerWidth / 2, rawY: window.innerHeight / 2 };
        const trailPos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        const cardRot = { currentX: 0, currentY: 0, targetX: 0, targetY: 0 };

        async function loadConfig() {
            try {
                const response = await fetch('config.json');
                CFG = response.ok ? await response.json() : getDefaultConfig();
                applyConfigToPage(CFG);
                fillSettingsPanel(CFG);
            } catch (e) { console.error(e); }
        }

        function hexToRgba(hex, alpha) {
            let c = hex.replace('#', '');
            if (c.length === 3) c = c.split('').map(x => x + x).join('');
            const num = parseInt(c, 16);
            return `rgba(${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}, ${alpha})`;
        }

        function applyConfigToPage(c) {
            CFG = c;
            
            // Настройка заголовка вкладки
            clearInterval(titleInterval);
            let titleText = `Bio | ${c.nickname || "User"} | `;
            if (c.scrollingTitle) {
                titleInterval = setInterval(() => {
                    titleText = titleText.substring(1) + titleText[0];
                    document.title = titleText;
                }, 300);
            } else { document.title = `Bio | ${c.nickname || "User"}`; }

            const nickEl = document.getElementById('nickname');
            nickEl.innerText = c.nickname || "";
            if (c.glitchName) nickEl.classList.add('glitch');
            else nickEl.classList.remove('glitch');

            document.getElementById('avatar').src = c.avatar || "";
            document.getElementById('song-title').innerText = c.songTitle || "";
            document.getElementById('enter-text').innerText = c.enterScreenText || "[ Click to enter ]";
            document.getElementById('link-tg').href = c.telegram || "#";
            document.getElementById('link-ds').href = c.discord || "#";

            const root = document.documentElement;
            root.style.setProperty('--theme-color', c.themeColor || '#00ffcc');
            root.style.setProperty('--glow-strength', (c.glowStrength || 20) + 'px');
            root.style.setProperty('--card-bg', hexToRgba(c.cardBgColor || '#0a0a0a', c.cardOpacity ?? 0.6));
            root.style.setProperty('--card-blur', (c.cardBlur ?? 16) + 'px');
            root.style.setProperty('--card-radius', (c.cardRadius ?? 20) + 'px');
            root.style.setProperty('--card-border', `rgba(255, 255, 255, ${c.cardBorderOpacity ?? 0.15})`);

            document.getElementById('crt-overlay').style.display = c.crtEffect ? 'block' : 'none';
            document.getElementById('vignette').style.display = c.vignette ? 'block' : 'none';
            document.getElementById('cursor-trail').style.display = c.enableCursorTrail ? 'block' : 'none';

            const audio = document.getElementById('bg-audio');
            audio.volume = c.audioVolume ?? 0.5;
            if (audio.src !== c.audioUrl && c.audioUrl) { audio.src = c.audioUrl; audio.load(); }

            document.getElementById('discord-status-dot').style.display = c.showDiscordStatus ? 'block' : 'none';
            if (c.discordId) connectLanyard(c.discordId);

            startTypewriter(c.bioText || "", c.typewriterSpeed || 70);
            initBackground();
        }

        function startTypewriter(text, speed) {
            clearTimeout(typeWriterTimeout);
            const el = document.getElementById('bio-text');
            el.innerHTML = '';
            let i = 0;
            function type() {
                if (i < text.length) {
                    el.innerHTML += text.charAt(i);
                    i++;
                    typeWriterTimeout = setTimeout(type, speed);
                }
            }
            type();
        }

        // --- Фон Canvas (Частицы + Матрица) ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let matrixDrops = [];
        const matrixChars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%^&*".split("");
        const matrixFontSize = 14;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if(CFG.bgType === 'matrix') initBackground(); // перерасчет колонок
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function initBackground() {
            particles = [];
            matrixDrops = [];
            if (CFG.bgType === 'particles') {
                const count = CFG.particleCount || 60;
                for (let i = 0; i < count; i++) {
                    particles.push({
                        x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                        r: Math.random() * 1.8 + 0.6,
                        vx: (Math.random() - 0.5) * (CFG.particleSpeed || 0.6),
                        vy: (Math.random() - 0.5) * (CFG.particleSpeed || 0.6),
                        alpha: Math.random() * 0.7 + 0.2
                    });
                }
            } else if (CFG.bgType === 'matrix') {
                const columns = canvas.width / matrixFontSize;
                for(let x = 0; x < columns; x++) matrixDrops[x] = 1;
            }
        }

        function renderCanvas() {
            // Текущий цвет темы (с учетом Chroma Mode)
            const currentColor = CFG.chromaMode ? `hsl(${chromaHue}, 100%, 50%)` : (CFG.themeColor || '#00ffcc');

            if (CFG.bgType === 'matrix') {
                ctx.fillStyle = "rgba(5, 5, 5, 0.05)"; // След матрицы
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = currentColor;
                ctx.font = matrixFontSize + "px monospace";
                
                for(let i = 0; i < matrixDrops.length; i++) {
                    const text = matrixChars[Math.floor(Math.random() * matrixChars.length)];
                    ctx.fillText(text, i * matrixFontSize, matrixDrops[i] * matrixFontSize);
                    if(matrixDrops[i] * matrixFontSize > canvas.height && Math.random() > 0.975) matrixDrops[i] = 0;
                    matrixDrops[i]++;
                }
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if (CFG.bgType === 'gradient') {
                    const grad = ctx.createRadialGradient(mouse.x, mouse.y, 10, mouse.x, mouse.y, canvas.width * 0.7);
                    grad.addColorStop(0, hexToRgba(currentColor, 0.12));
                    grad.addColorStop(1, '#050505');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                } else if (CFG.bgType === 'particles') {
                    ctx.fillStyle = '#050505';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    for (let i = 0; i < particles.length; i++) {
                        const p = particles[i];
                        p.x += p.vx; p.y += p.vy;
                        if (p.x < 0) p.x = canvas.width;
                        if (p.x > canvas.width) p.x = 0;
                        if (p.y < 0) p.y = canvas.height;
                        if (p.y > canvas.height) p.y = 0;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                        ctx.fillStyle = hexToRgba(currentColor, p.alpha);
                        ctx.fill();
                    }
                } else {
                    ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
            }

            // Рендер искр клика
            if (sparks.length > 0) {
                for(let i = sparks.length - 1; i >= 0; i--) {
                    const s = sparks[i];
                    s.x += s.vx; s.y += s.vy; s.life -= 0.02;
                    if(s.life <= 0) { sparks.splice(i, 1); continue; }
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, 2, 0, Math.PI * 2);
                    ctx.fillStyle = hexToRgba(s.color, s.life);
                    ctx.fill();
                }
            }
        }

        // --- Искры при клике ---
        window.addEventListener('click', (e) => {
            if(!CFG.clickSparks || e.target.closest('#settings-panel') || e.target.closest('#enter-screen')) return;
            const clickColor = CFG.chromaMode ? `hsl(${chromaHue}, 100%, 50%)` : (CFG.themeColor || '#00ffcc');
            for(let i=0; i<15; i++) {
                sparks.push({
                    x: e.clientX, y: e.clientY,
                    vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8,
                    life: 1, color: clickColor
                });
            }
        });

        // --- Анимационный цикл ---
        const dot = document.getElementById('cursor-dot');
        const trail = document.getElementById('cursor-trail');
        const card = document.getElementById('card');

        window.addEventListener('mousemove', (e) => {
            mouse.rawX = e.clientX; mouse.rawY = e.clientY;
            dot.style.transform = `translate3d(${mouse.rawX}px, ${mouse.rawY}px, 0) translate(-50%, -50%)`;
            const sens = CFG.tiltSensitivity || 25; const maxA = CFG.tiltMaxAngle || 15;
            let targetY = (window.innerWidth / 2 - mouse.rawX) / sens;
            let targetX = (mouse.rawY - window.innerHeight / 2) / sens;
            cardRot.targetX = Math.max(-maxA, Math.min(maxA, targetX));
            cardRot.targetY = Math.max(-maxA, Math.min(maxA, targetY));
        }, { passive: true });

        window.addEventListener('mouseleave', () => { cardRot.targetX = 0; cardRot.targetY = 0; });

        function animLoop() {
            mouse.x += (mouse.rawX - mouse.x) * 0.15;
            mouse.y += (mouse.rawY - mouse.y) * 0.15;
            trailPos.x += (mouse.rawX - trailPos.x) * 0.2;
            trailPos.y += (mouse.rawY - trailPos.y) * 0.2;
            trail.style.transform = `translate3d(${trailPos.x}px, ${trailPos.y}px, 0) translate(-50%, -50%)`;

            const smooth = CFG.tiltSmoothness || 0.1;
            cardRot.currentX += (cardRot.targetX - cardRot.currentX) * smooth;
            cardRot.currentY += (cardRot.targetY - cardRot.currentY) * smooth;
            card.style.transform = `rotateX(${cardRot.currentX.toFixed(2)}deg) rotateY(${cardRot.currentY.toFixed(2)}deg)`;

            // Chroma Mode Логика
            if (CFG.chromaMode) {
                chromaHue = (chromaHue + 0.5) % 360;
                document.documentElement.style.setProperty('--theme-color', `hsl(${chromaHue}, 100%, 50%)`);
            }

            renderCanvas();
            requestAnimationFrame(animLoop);
        }
        requestAnimationFrame(animLoop);

        // --- Lanyard (Discord Status) ---
        function connectLanyard(userId) {
            if (lanyardWs) lanyardWs.close();
            lanyardWs = new WebSocket("wss://api.lanyard.rest/socket");
            lanyardWs.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.op === 1) {
                    setInterval(() => lanyardWs.send(JSON.stringify({ op: 3 })), data.d.heartbeat_interval);
                    lanyardWs.send(JSON.stringify({ op: 2, d: { subscribe_to_id: userId } }));
                }
                if (data.t === "INIT_STATE" || data.t === "PRESENCE_UPDATE") updatePresence(data.d);
            };
        }

        function updatePresence(d) {
            const statusColors = { online: "#43b581", idle: "#faa61a", dnd: "#f04747", offline: "#747f8d" };
            document.getElementById('discord-status-dot').style.backgroundColor = statusColors[d.discord_status] || statusColors.offline;
            if (!CFG.showDiscordActivity) { document.getElementById('discord-activity-badge').style.display = 'none'; return; }

            let act = null;
            if (d.listening_to_spotify) act = `🎵 ${d.spotify.song} — ${d.spotify.artist}`;
            else if (d.activities && d.activities.length > 0) {
                const main = d.activities.find(a => a.type !== 4);
                if (main) act = `🎮 ${main.name}${main.details ? ` (${main.details})` : ''}`;
                else if (d.activities[0].state) act = `💬 ${d.activities[0].state}`;
            }

            const badge = document.getElementById('discord-activity-badge');
            if (act) { document.getElementById('discord-activity-text').innerText = act; badge.style.display = 'inline-flex'; }
            else { badge.style.display = 'none'; }
        }

        // --- UI Интерактивы ---
        function enterSite() {
            const screen = document.getElementById('enter-screen');
            screen.style.opacity = '0';
            setTimeout(() => screen.style.display = 'none', 400);
            document.getElementById('bg-audio').play().catch(() => {});
            isPlaying = true;
        }

        const audio = document.getElementById('bg-audio');
        const playBtn = document.getElementById('play-pause');
        playBtn.addEventListener('click', () => {
            if (isPlaying) { audio.pause(); playBtn.innerHTML = '▶'; }
            else { audio.play(); playBtn.innerHTML = '⏸'; }
            isPlaying = !isPlaying;
        });

        // --- Панель Настроек ---
        function fillSettingsPanel(c) {
            document.getElementById('set-nickname').value = c.nickname || '';
            document.getElementById('set-glitch').value = String(c.glitchName !== false);
            document.getElementById('set-scrolltitle').value = String(c.scrollingTitle !== false);
            document.getElementById('set-bio').value = c.bioText || '';
            document.getElementById('set-typespeed').value = c.typewriterSpeed || 70;
            document.getElementById('set-avatar').value = c.avatar || '';
            document.getElementById('set-dsid').value = c.discordId || '';
            document.getElementById('set-showstatus').value = String(c.showDiscordStatus !== false);
            document.getElementById('set-showact').value = String(c.showDiscordActivity !== false);
            document.getElementById('set-tg').value = c.telegram || '';
            document.getElementById('set-ds').value = c.discord || '';
            document.getElementById('set-audio').value = c.audioUrl || '';
            document.getElementById('set-song').value = c.songTitle || '';
            document.getElementById('set-volume').value = c.audioVolume ?? 0.5;
            document.getElementById('set-color').value = c.themeColor || '#00ffcc';
            document.getElementById('set-chroma').value = String(c.chromaMode === true);
            document.getElementById('set-glow').value = c.glowStrength ?? 20;
            document.getElementById('set-cardbg').value = c.cardBgColor || '#0a0a0a';
            document.getElementById('set-cardop').value = c.cardOpacity ?? 0.6;
            document.getElementById('set-cardblur').value = c.cardBlur ?? 16;
            document.getElementById('set-bgtype').value = c.bgType || 'matrix';
            document.getElementById('set-pcount').value = c.particleCount || 60;
            document.getElementById('set-trail').value = String(c.enableCursorTrail !== false);
            document.getElementById('set-crt').value = String(c.crtEffect === true);
            document.getElementById('set-vignette').value = String(c.vignette === true);
            document.getElementById('set-sparks').value = String(c.clickSparks !== false);
        }

        function extractInputs() {
            return {
                nickname: document.getElementById('set-nickname').value,
                glitchName: document.getElementById('set-glitch').value === "true",
                scrollingTitle: document.getElementById('set-scrolltitle').value === "true",
                discordId: document.getElementById('set-dsid').value,
                showDiscordStatus: document.getElementById('set-showstatus').value === "true",
                showDiscordActivity: document.getElementById('set-showact').value === "true",
                bioText: document.getElementById('set-bio').value,
                typewriterSpeed: parseInt(document.getElementById('set-typespeed').value) || 70,
                avatar: document.getElementById('set-avatar').value,
                audioUrl: document.getElementById('set-audio').value,
                audioVolume: parseFloat(document.getElementById('set-volume').value),
                songTitle: document.getElementById('set-song').value,
                telegram: document.getElementById('set-tg').value,
                discord: document.getElementById('set-ds').value,
                themeColor: document.getElementById('set-color').value,
                chromaMode: document.getElementById('set-chroma').value === "true",
                glowStrength: parseInt(document.getElementById('set-glow').value),
                cardBgColor: document.getElementById('set-cardbg').value,
                cardOpacity: parseFloat(document.getElementById('set-cardop').value),
                cardBlur: parseInt(document.getElementById('set-cardblur').value),
                bgType: document.getElementById('set-bgtype').value,
                particleCount: parseInt(document.getElementById('set-pcount').value),
                enableCursorTrail: document.getElementById('set-trail').value === "true",
                crtEffect: document.getElementById('set-crt').value === "true",
                vignette: document.getElementById('set-vignette').value === "true",
                clickSparks: document.getElementById('set-sparks').value === "true"
            };
        }

        function applyPreview() { applyConfigToPage(extractInputs()); }

        function downloadJson() {
            const data = extractInputs();
            const str = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 4));
            const dl = document.createElement('a');
            dl.setAttribute("href", str);
            dl.setAttribute("download", "config.json");
            document.body.appendChild(dl); dl.click(); dl.remove();
            applyPreview();
        }

        document.addEventListener('dblclick', (e) => {
            if (e.target.closest('.card') || e.target.closest('#settings-panel') || e.target.closest('#enter-screen')) return;
            const p = document.getElementById('settings-panel');
            p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
        });

        loadConfig();
    </script>
</body>
</html>
