<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio</title>
    <style>
        :root {
            --theme-color: #00ffcc;
            --glow-strength: 20px;
            --card-bg: rgba(10, 10, 10, 0.6);
            --card-blur: 16px;
            --card-radius: 20px;
            --card-border: rgba(255, 255, 255, 0.15);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0; overflow: hidden;
            background-color: #050505; color: #fff;
            font-family: 'Consolas', 'Courier New', monospace;
            cursor: none; user-select: none;
        }

        #bg-canvas, #bg-video {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -2; pointer-events: none;
            object-fit: cover;
        }
        #bg-video { display: none; }

        .cursor-dot, .cursor-trail {
            position: fixed; top: 0; left: 0;
            border-radius: 50%; pointer-events: none;
            will-change: transform;
            transform: translate3d(-50%, -50%, 0);
        }
        .cursor-dot { width: 6px; height: 6px; background: #fff; z-index: 99999; }
        .cursor-trail {
            width: 26px; height: 26px;
            border: 1.5px solid var(--theme-color);
            box-shadow: 0 0 var(--glow-strength) var(--theme-color);
            z-index: 99998;
        }

        #enter-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #050505; z-index: 99990;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: opacity 0.4s ease;
        }
        #enter-screen span {
            font-size: 18px; font-weight: bold; letter-spacing: 2px;
            color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.4);
            animation: pulse 1.6s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1); text-shadow: 0 0 var(--glow-strength) var(--theme-color); }
        }

        .crt-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.04));
            background-size: 100% 3px, 3px 100%; z-index: -1; pointer-events: none; display: none;
        }

        .vignette {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            box-shadow: inset 0 0 200px rgba(0,0,0,0.95);
            z-index: -1; pointer-events: none; display: none;
        }

        .container {
            display: flex; justify-content: center; align-items: center;
            height: 100vh; perspective: 1000px;
        }
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(var(--card-blur)); -webkit-backdrop-filter: blur(var(--card-blur));
            padding: 35px 40px; border-radius: var(--card-radius);
            border: 1px solid var(--card-border); text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
            transform-style: preserve-3d; width: 340px; will-change: transform;
            position: relative; overflow: hidden;
        }

        /* 3D Glass Shimmer effect */
        .shimmer {
            position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.08), transparent 40%);
            pointer-events: none; transform: translateZ(1px);
            opacity: 0; transition: opacity 0.3s;
        }
        .card:hover .shimmer { opacity: 1; }

        .avatar-box {
            position: relative; width: 110px; height: 110px;
            margin: 0 auto 15px auto; transform: translateZ(50px);
        }
        .avatar {
            width: 100%; height: 100%; border-radius: 50%;
            border: 2px solid var(--card-border); object-fit: cover;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }
        .status-dot {
            width: 20px; height: 20px; border-radius: 50%;
            position: absolute; bottom: 2px; right: 2px;
            border: 3px solid #0a0a0a; background-color: #747f8d;
        }

        h1 {
            font-size: 22px; margin: 5px 0 3px 0; transform: translateZ(35px);
            letter-spacing: 0.5px; position: relative; display: inline-block;
        }
        h1.glitch:hover { animation: glitch-skew 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite; }
        @keyframes glitch-skew {
            0% { transform: translateZ(35px) translate(0); text-shadow: 2px 0 var(--theme-color), -2px 0 #ff003c; }
            20% { transform: translateZ(35px) translate(-2px, 2px); text-shadow: -2px 0 var(--theme-color), 2px 0 #ff003c; }
            40% { transform: translateZ(35px) translate(-2px, -2px); text-shadow: 2px 0 var(--theme-color), -2px 0 #ff003c; }
            60% { transform: translateZ(35px) translate(2px, 2px); text-shadow: -2px 0 var(--theme-color), 2px 0 #ff003c; }
            80% { transform: translateZ(35px) translate(2px, -2px); text-shadow: 2px 0 var(--theme-color), -2px 0 #ff003c; }
            100% { transform: translateZ(35px) translate(0); text-shadow: 2px 0 var(--theme-color), -2px 0 #ff003c; }
        }

        .bio {
            font-size: 13px; color: var(--theme-color); margin-bottom: 12px;
            transform: translateZ(30px); min-height: 16px;
            text-shadow: 0 0 8px var(--theme-color); display: inline-block;
        }
        .cursor-blink { animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        .discord-status-badge {
            transform: translateZ(30px); background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--card-border);
            padding: 7px 12px; border-radius: 8px; font-size: 11px;
            color: #ddd; margin-bottom: 15px; display: none;
            align-items: center; justify-content: center;
        }
        .discord-status-badge span {
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 230px;
        }

        /* Обновленные ссылки-иконки */
        .links { 
            transform: translateZ(25px); 
            display: flex; justify-content: center; gap: 15px; margin: 15px 0;
        }
        .links a {
            display: flex; align-items: center; justify-content: center;
            width: 40px; height: 40px; border-radius: 10px;
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--card-border);
            color: #fff; transition: all 0.2s; cursor: none;
        }
        .links a svg { width: 20px; height: 20px; fill: currentColor; }
        .links a:hover {
            background: var(--theme-color); color: #000;
            box-shadow: 0 0 var(--glow-strength) var(--theme-color);
            border-color: var(--theme-color);
        }

        .player {
            margin-top: 15px; transform: translateZ(25px); display: flex;
            align-items: center; justify-content: space-between; gap: 10px;
            background: rgba(0, 0, 0, 0.4); padding: 8px 14px; border-radius: 10px;
            border: 1px solid var(--card-border); position: relative; overflow: hidden;
        }
        .play-btn { background: none; border: none; color: white; font-size: 16px; cursor: none; transition: transform 0.1s; z-index: 2;}
        .play-btn:active { transform: scale(0.9); }
        .song-title { font-size: 12px; opacity: 0.8; flex-grow: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 2;}
        
        #visualizer { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.4; }

    </style>
</head>
<body>

    <video id="bg-video" autoplay loop muted playsinline></video>
    <canvas id="bg-canvas"></canvas>

    <div class="cursor-dot" id="cursor-dot"></div>
    <div class="cursor-trail" id="cursor-trail"></div>

    <div id="enter-screen" onclick="enterSite()">
        <span id="enter-text">[ Click to enter ]</span>
    </div>

    <div class="crt-overlay" id="crt-overlay"></div>
    <div class="vignette" id="vignette"></div>
    <audio id="bg-audio" loop></audio>

    <div class="container" id="container">
        <div class="card" id="card">
            <div class="shimmer" id="shimmer"></div>
            <div class="avatar-box">
                <img id="avatar" src="" alt="Avatar" class="avatar">
                <div class="status-dot" id="discord-status-dot"></div>
            </div>
            
            <h1 id="nickname">Loading...</h1>
            <div>
                <span class="bio" id="bio-text"></span><span class="bio cursor-blink">_</span>
            </div>
            
            <div class="discord-status-badge" id="discord-activity-badge">
                <span id="discord-activity-text"></span>
            </div>

            <div class="links" id="social-links">
                <!-- Ссылки генерируются через JS -->
            </div>
            
            <div class="player">
                <canvas id="visualizer"></canvas>
                <button class="play-btn" id="play-pause">▶</button>
                <div class="song-title" id="song-title">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        let CFG = {};
        let lanyardWs = null;
        let isPlaying = false;
        let sparks = []; 
        let chromaHue = 0; 
        
        // Audio Visualizer vars
        let audioCtx, analyser, source, dataArray, bufferLength;
        const vizCanvas = document.getElementById('visualizer');
        const vizCtx = vizCanvas.getContext('2d');

        // Typing vars
        let bioIndex = 0, charIndex = 0, isDeleting = false;

        const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2, rawX: window.innerWidth / 2, rawY: window.innerHeight / 2 };
        const trailPos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        const cardRot = { currentX: 0, currentY: 0, targetX: 0, targetY: 0 };

        const SVG_ICONS = {
            telegram: '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.19-.08-.05-.19-.02-.27 0-.11.03-1.84 1.18-5.21 3.45-.49.33-.94.5-1.35.49-.45-.01-1.31-.25-1.95-.46-.78-.26-1.4-.4-1.35-.85.03-.23.36-.47 1-.72 3.92-1.7 6.53-2.83 7.84-3.37 3.73-1.55 4.51-1.82 5.02-1.82.11 0 .36.03.49.13.11.08.14.19.15.28-.01.06-.01.13-.02.21z"/></svg>',
            discord: '<svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0a12.64 12.64 0 0 0-.617-1.25a.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057a19.9 19.9 0 0 0 5.993 3.03a.078.078 0 0 0 .084-.028a14.09 14.09 0 0 0 1.226-1.994a.076.076 0 0 0-.041-.106a13.107 13.107 0 0 1-1.872-.892a.077.077 0 0 1-.008-.128a10.2 10.2 0 0 0 .372-.292a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127a12.299 12.299 0 0 1-1.873.892a.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028a19.839 19.839 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.956-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.955-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.946 2.418-2.157 2.418z"/></svg>',
            github: '<svg viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.161 22 16.418 22 12c0-5.523-4.477-10-10-10z"/></svg>',
            steam: '<svg viewBox="0 0 24 24"><path d="M11.979 2C6.452 2 1.979 6.47 1.979 12c0 2.27.765 4.364 2.051 6.03l3.87-5.51c.01-.06.02-.12.02-.18 0-1.89 1.53-3.42 3.42-3.42 1.89 0 3.42 1.53 3.42 3.42 0 1.89-1.53 3.42-3.42 3.42-.31 0-.6-.05-.88-.13l-4.22 6.03c1.78.89 3.8 1.41 5.95 1.41 5.52 0 10-4.47 10-10s-4.48-10-10-10zM11.34 13.91c-.96 0-1.74-.78-1.74-1.74s.78-1.74 1.74-1.74 1.74.78 1.74 1.74-.78 1.74-1.74 1.74z"/></svg>'
        };

        // Пасхалка в консоли
        console.log("%c \n ___   _   ___  _ _  __  _   _ \n| _ \\ /_\\ |   \\/ | |/ / /_\\ | |\n|   // _ \\| |) | | ' < / _ \\| |__\n|_|_/_/ \\_|___/|_|_|\\_/_/ \\_|____|", "color: #00ffcc; font-weight: bold; font-size: 14px; text-shadow: 0 0 10px #00ffcc;");
        console.log("%cПривет! Если ты это читаешь — приятного кода. ", "color: #fff; font-size: 12px;");

        async function loadConfig() {
            try {
                const response = await fetch('config.json');
                CFG = response.ok ? await response.json() : {};
                applyConfigToPage(CFG);
            } catch (e) { console.error(e); }
        }

        function hexToRgba(hex, alpha) {
            let c = hex.replace('#', '');
            if (c.length === 3) c = c.split('').map(x => x + x).join('');
            const num = parseInt(c, 16);
            return `rgba(${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}, ${alpha})`;
        }

        function applyConfigToPage(c) {
            CFG = c;
            
            document.title = `Bio | ${c.nickname || "User"}`;
            const nickEl = document.getElementById('nickname');
            nickEl.innerText = c.nickname || "";
            if (c.glitchName) nickEl.classList.add('glitch');

            document.getElementById('avatar').src = c.avatar || "";
            document.getElementById('song-title').innerText = c.songTitle || "";
            
            // Генерация ссылок
            const linksContainer = document.getElementById('social-links');
            linksContainer.innerHTML = '';
            if (c.socials) {
                for (const [key, url] of Object.entries(c.socials)) {
                    if (url && SVG_ICONS[key]) {
                        linksContainer.innerHTML += `<a href="${url}" target="_blank" title="${key}">${SVG_ICONS[key]}</a>`;
                    }
                }
            }

            const root = document.documentElement;
            root.style.setProperty('--theme-color', c.themeColor || '#00ffcc');
            root.style.setProperty('--glow-strength', (c.glowStrength || 20) + 'px');
            root.style.setProperty('--card-bg', hexToRgba(c.cardBgColor || '#0a0a0a', c.cardOpacity ?? 0.6));
            root.style.setProperty('--card-blur', (c.cardBlur ?? 16) + 'px');

            document.getElementById('crt-overlay').style.display = c.crtEffect ? 'block' : 'none';
            document.getElementById('vignette').style.display = c.vignette ? 'block' : 'none';
            document.getElementById('cursor-trail').style.display = c.enableCursorTrail ? 'block' : 'none';
            document.getElementById('shimmer').style.display = c.glassShimmer ? 'block' : 'none';
            document.getElementById('visualizer').style.display = c.enableVisualizer ? 'block' : 'none';

            const audio = document.getElementById('bg-audio');
            audio.volume = c.audioVolume ?? 0.5;
            if (audio.src !== c.audioUrl && c.audioUrl) { audio.src = c.audioUrl; audio.load(); }

            document.getElementById('discord-status-dot').style.display = c.showDiscordStatus ? 'block' : 'none';
            if (c.discordId) connectLanyard(c.discordId);

            // Инициализация видео или канваса
            const vidEl = document.getElementById('bg-video');
            const canvEl = document.getElementById('bg-canvas');
            if (c.bgType === 'video' && c.videoUrl) {
                vidEl.style.display = 'block'; canvEl.style.display = 'none';
                vidEl.src = c.videoUrl;
            } else {
                vidEl.style.display = 'none'; canvEl.style.display = 'block';
                initBackground();
            }

            typeWriterEffect();
        }

        // --- Динамический био (Typewriter с удалением) ---
        function typeWriterEffect() {
            const el = document.getElementById('bio-text');
            const texts = CFG.bioTexts || ["Hello World"];
            const speed = CFG.typewriterSpeed || 100;
            const currentText = texts[bioIndex % texts.length];
            
            if (isDeleting) {
                el.innerText = currentText.substring(0, charIndex - 1);
                charIndex--;
            } else {
                el.innerText = currentText.substring(0, charIndex + 1);
                charIndex++;
            }

            let typeSpeed = isDeleting ? speed / 2 : speed;

            if (!isDeleting && charIndex === currentText.length) {
                typeSpeed = 2000; // Пауза перед удалением
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                bioIndex++;
                typeSpeed = 500; // Пауза перед новым словом
            }
            setTimeout(typeWriterEffect, typeSpeed);
        }

        // --- Фон Canvas (Частицы + Матрица) ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [], matrixDrops = [];
        const matrixChars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%^&*".split("");
        const matrixFontSize = 14;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if(CFG.bgType === 'matrix') initBackground();
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function initBackground() {
            particles = []; matrixDrops = [];
            if (CFG.bgType === 'particles') {
                for (let i = 0; i < (CFG.particleCount || 60); i++) {
                    particles.push({
                        x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                        r: Math.random() * 1.8 + 0.6,
                        vx: (Math.random() - 0.5) * 0.6, vy: (Math.random() - 0.5) * 0.6,
                        alpha: Math.random() * 0.7 + 0.2
                    });
                }
            } else if (CFG.bgType === 'matrix') {
                for(let x = 0; x < canvas.width / matrixFontSize; x++) matrixDrops[x] = 1;
            }
        }

        function renderCanvas() {
            const currentColor = CFG.chromaMode ? `hsl(${chromaHue}, 100%, 50%)` : (CFG.themeColor || '#00ffcc');
            if (CFG.bgType === 'matrix') {
                ctx.fillStyle = "rgba(5, 5, 5, 0.05)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = currentColor;
                ctx.font = matrixFontSize + "px monospace";
                for(let i = 0; i < matrixDrops.length; i++) {
                    const text = matrixChars[Math.floor(Math.random() * matrixChars.length)];
                    ctx.fillText(text, i * matrixFontSize, matrixDrops[i] * matrixFontSize);
                    if(matrixDrops[i] * matrixFontSize > canvas.height && Math.random() > 0.975) matrixDrops[i] = 0;
                    matrixDrops[i]++;
                }
            } else if (CFG.bgType !== 'video') {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.x += p.vx; p.y += p.vy;
                    if (p.x < 0) p.x = canvas.width; if (p.x > canvas.width) p.x = 0;
                    if (p.y < 0) p.y = canvas.height; if (p.y > canvas.height) p.y = 0;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = hexToRgba(currentColor, p.alpha); ctx.fill();
                }
            }

            if (sparks.length > 0) {
                for(let i = sparks.length - 1; i >= 0; i--) {
                    const s = sparks[i];
                    s.x += s.vx; s.y += s.vy; s.life -= 0.02;
                    if(s.life <= 0) { sparks.splice(i, 1); continue; }
                    ctx.beginPath(); ctx.arc(s.x, s.y, 2, 0, Math.PI * 2);
                    ctx.fillStyle = hexToRgba(s.color, s.life); ctx.fill();
                }
            }
        }

        window.addEventListener('click', (e) => {
            if(!CFG.clickSparks || e.target.closest('#enter-screen')) return;
            const cColor = CFG.chromaMode ? `hsl(${chromaHue}, 100%, 50%)` : (CFG.themeColor || '#00ffcc');
            for(let i=0; i<15; i++) {
                sparks.push({ x: e.clientX, y: e.clientY, vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8, life: 1, color: cColor });
            }
        });

        // --- Lanyard ---
        function connectLanyard(userId) {
            if (lanyardWs) lanyardWs.close();
            lanyardWs = new WebSocket("wss://api.lanyard.rest/socket");
            lanyardWs.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.op === 1) {
                    setInterval(() => lanyardWs.send(JSON.stringify({ op: 3 })), data.d.heartbeat_interval);
                    lanyardWs.send(JSON.stringify({ op: 2, d: { subscribe_to_id: userId } }));
                }
                if (data.t === "INIT_STATE" || data.t === "PRESENCE_UPDATE") updatePresence(data.d);
            };
        }

        function updatePresence(d) {
            const sColors = { online: "#43b581", idle: "#faa61a", dnd: "#f04747", offline: "#747f8d" };
            document.getElementById('discord-status-dot').style.backgroundColor = sColors[d.discord_status] || sColors.offline;
            if (!CFG.showDiscordActivity) return;

            let act = null;
            if (d.listening_to_spotify) act = `🎵 ${d.spotify.song} — ${d.spotify.artist}`;
            else if (d.activities && d.activities.length > 0) {
                const main = d.activities.find(a => a.type !== 4);
                if (main) act = `🎮 ${main.name}${main.details ? ` (${main.details})` : ''}`;
                else if (d.activities[0].state) act = `💬 ${d.activities[0].state}`;
            }

            const badge = document.getElementById('discord-activity-badge');
            if (act) { document.getElementById('discord-activity-text').innerText = act; badge.style.display = 'inline-flex'; }
            else { badge.style.display = 'none'; }
        }

        // --- Audio Visualizer ---
        function initAudioAPI() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            source = audioCtx.createMediaElementSource(document.getElementById('bg-audio'));
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            analyser.fftSize = 64;
            bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);
        }

        function drawVisualizer() {
            if (!audioCtx || !CFG.enableVisualizer) return;
            vizCanvas.width = vizCanvas.offsetWidth;
            vizCanvas.height = vizCanvas.offsetHeight;
            analyser.getByteFrequencyData(dataArray);

            vizCtx.clearRect(0, 0, vizCanvas.width, vizCanvas.height);
            const barWidth = (vizCanvas.width / bufferLength) * 2.5;
            let barHeight, x = 0;
            const cColor = CFG.chromaMode ? `hsl(${chromaHue}, 100%, 50%)` : (CFG.themeColor || '#00ffcc');

            for(let i = 0; i < bufferLength; i++) {
                barHeight = dataArray[i] / 2;
                vizCtx.fillStyle = cColor;
                vizCtx.fillRect(x, vizCanvas.height - barHeight, barWidth, barHeight);
                x += barWidth + 1;
            }
        }

        // --- Animations & Inputs ---
        window.addEventListener('mousemove', (e) => {
            mouse.rawX = e.clientX; mouse.rawY = e.clientY;
            const dot = document.getElementById('cursor-dot');
            if(dot) dot.style.transform = `translate3d(${mouse.rawX}px, ${mouse.rawY}px, 0) translate(-50%, -50%)`;
            
            const sens = 25, maxA = 15;
            let tY = (window.innerWidth / 2 - mouse.rawX) / sens;
            let tX = (mouse.rawY - window.innerHeight / 2) / sens;
            cardRot.targetX = Math.max(-maxA, Math.min(maxA, tX));
            cardRot.targetY = Math.max(-maxA, Math.min(maxA, tY));

            // Shimmer effect logic
            if(CFG.glassShimmer) {
                const shim = document.getElementById('shimmer');
                const pX = (mouse.rawX / window.innerWidth) * 100;
                const pY = (mouse.rawY / window.innerHeight) * 100;
                shim.style.background = `radial-gradient(circle at ${pX}% ${pY}%, rgba(255,255,255,0.08), transparent 40%)`;
            }
        }, { passive: true });

        window.addEventListener('mouseleave', () => { cardRot.targetX = 0; cardRot.targetY = 0; });

        function animLoop() {
            mouse.x += (mouse.rawX - mouse.x) * 0.15; mouse.y += (mouse.rawY - mouse.y) * 0.15;
            trailPos.x += (mouse.rawX - trailPos.x) * 0.2; trailPos.y += (mouse.rawY - trailPos.y) * 0.2;
            const trail = document.getElementById('cursor-trail');
            if(trail) trail.style.transform = `translate3d(${trailPos.x}px, ${trailPos.y}px, 0) translate(-50%, -50%)`;

            cardRot.currentX += (cardRot.targetX - cardRot.currentX) * 0.1;
            cardRot.currentY += (cardRot.targetY - cardRot.currentY) * 0.1;
            document.getElementById('card').style.transform = `rotateX(${cardRot.currentX.toFixed(2)}deg) rotateY(${cardRot.currentY.toFixed(2)}deg)`;

            if (CFG.chromaMode) {
                chromaHue = (chromaHue + 0.5) % 360;
                document.documentElement.style.setProperty('--theme-color', `hsl(${chromaHue}, 100%, 50%)`);
            }

            renderCanvas();
            drawVisualizer();
            requestAnimationFrame(animLoop);
        }
        requestAnimationFrame(animLoop);

        // UI Interactions
        function enterSite() {
            const screen = document.getElementById('enter-screen');
            screen.style.opacity = '0';
            setTimeout(() => screen.style.display = 'none', 400);
            
            initAudioAPI();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            document.getElementById('bg-audio').play().catch(() => {});
            const v = document.getElementById('bg-video');
            if(v && v.src) v.play().catch(()=>{});
            isPlaying = true;
        }

        const audio = document.getElementById('bg-audio');
        const playBtn = document.getElementById('play-pause');
        playBtn.addEventListener('click', () => {
            if (isPlaying) { audio.pause(); playBtn.innerHTML = '▶'; }
            else { audio.play(); playBtn.innerHTML = '⏸'; }
            isPlaying = !isPlaying;
        });

        loadConfig();
    </script>
</body>
</html>
